
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Catálogo de Filmes{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f0f8;
            color: #30283b;
        }

        header {
            background: #6c4b83;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        main {
            max-width: 950px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .painel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        h2 {
            color: #6c4b83;
        }

        .botao {
            display: inline-block;
            background: #6c4b83;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .botao:hover {
            background: #513764;
        }

        .perigo {
            background: #b83c53;
        }

        .secundario {
            background: #777;
        }

        .mensagem {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 7px;
        }

        .sucesso {
            background: #d9f4df;
            color: #205b30;
        }

        .erro {
            background: #ffe0e0;
            color: #8a2222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5dfea;
            text-align: left;
        }

        th {
            background: #eee5f5;
        }

        input {
            width: 100%;
            padding: 11px;
            margin: 7px 0 17px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        label {
            font-weight: bold;
        }

        .acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #71677a;
        }

        @media (max-width: 600px) {
            .painel {
                padding: 15px;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 8px 5px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 Catálogo de Filmes</h1>
        <p>Organize seus filmes favoritos!</p>

        <nav>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('adicionar') }}">Cadastrar filme</a>
        </nav>
    </header>

    <main>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="mensagem {{ categoria }}">
                    {{ mensagem }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block conteudo %}{% endblock %}
    </main>

    <footer>
        <p>Catálogo de Filmes | UC32</p>
    </footer>

</body>
</html>
